global
  maxconn 64
defaults
  mode http
  timeout connect 5s
  timeout client 1h
  timeout server 1h
frontend docker_logs
  bind :2375
  acl read_method method GET HEAD
  acl log_path path_reg ^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[a-f0-9]+/logs)$
  http-request deny unless read_method log_path
  default_backend docker_socket
backend docker_socket
  server docker /var/run/docker.sock
