name: fix-pro-local

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fix_pro
      POSTGRES_USER: fixpro
      POSTGRES_PASSWORD: fixpro-local
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixpro -d fix_pro"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../apps/server-go
    entrypoint: ["/app/migrate"]
    environment:
      APP_ENV: local
      DB_DSN: postgres://fixpro:fixpro-local@postgres:5432/fix_pro?sslmode=disable&timezone=UTC
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ../apps/server-go
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DB_DSN: postgres://fixpro:fixpro-local@postgres:5432/fix_pro?sslmode=disable&timezone=UTC
      MEDIA_DRIVER: local
      MEDIA_LOCAL_ROOT: /data/media
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: change-me-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fixpro
      MINIO_ROOT_PASSWORD: fixpro-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
  media-data:
