---
openapi: 3.1.0
info:
  title: 灵狸护家 API
  version: 2.0.0-service-sku
servers:
- url: http://localhost:8080
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Single diagnostic ID; invalid values are replaced by server-generated
        IDs.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
  securitySchemes:
    miniBearer:
      type: http
      scheme: bearer
    adminSession:
      type: apiKey
      in: cookie
      name: fixpro_admin_session
    adminBasic:
      type: http
      scheme: basic
      description: Deprecated local compatibility only
  headers:
    RequestId:
      description: Diagnostic request ID; returned on JSON, media and error responses
        and exposed by CORS.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    CSRFToken:
      description: Required on state-changing admin requests when using cookie sessions.
      schema:
        type: string
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        requestId:
          type: string
    ServiceItem:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 30
        description:
          type: string
          minLength: 5
          maxLength: 200
        iconKey:
          type: string
          enum:
          - service
          - inspect
          - protect
          - tool
          - clean
          - install
          - report
          - confirm
        imageMediaId:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - title
      - description
    QuantityRule:
      type: object
      additionalProperties: false
      properties:
        min:
          type: integer
          minimum: 1
          maximum: 9999
        max:
          type: integer
          minimum: 1
          maximum: 9999
        step:
          type: integer
          minimum: 1
          maximum: 9999
        aggregation:
          type: string
          enum:
          - INDEPENDENT
          - ADDITIVE
      required:
      - min
      - max
      - step
      - aggregation
    CollectionField:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - HIDDEN
          - OPTIONAL
          - REQUIRED
        label:
          type: string
          minLength: 2
          maxLength: 20
        hint:
          type: string
          minLength: 5
          maxLength: 150
      required:
      - mode
    AfterSales:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - WARRANTY
          - REWORK
          - SUPPORT
        summary:
          type: string
          minLength: 5
          maxLength: 120
        coverage:
          type: string
          minLength: 5
          maxLength: 300
        exclusions:
          type: array
          items:
            type: string
            minLength: 5
            maxLength: 150
          minItems: 0
          maxItems: 8
        contactDescription:
          type: string
          minLength: 5
          maxLength: 150
        period:
          type: object
          additionalProperties: false
          properties:
            value:
              type: integer
              minimum: 1
              maximum: 3650
            unit:
              type: string
              enum:
              - HOUR
              - DAY
              - MONTH
            startDescription:
              type: string
              minLength: 5
              maxLength: 100
          required:
          - value
          - unit
          - startDescription
      required:
      - type
      - summary
      - coverage
      - contactDescription
    Enhancements:
      type: object
      additionalProperties: false
      properties:
        tags:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 16
          minItems: 0
          maxItems: 6
        facts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              label:
                type: string
                minLength: 2
                maxLength: 20
              value:
                type: string
                minLength: 1
                maxLength: 100
            required:
            - label
            - value
          minItems: 0
          maxItems: 8
        resources:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 2
                maxLength: 30
              provider:
                type: string
                enum:
                - PROVIDER
                - CUSTOMER
                - SHARED
              description:
                type: string
                minLength: 5
                maxLength: 150
            required:
            - name
            - provider
            - description
          minItems: 0
          maxItems: 8
        preparations:
          type: array
          items:
            type: string
            minLength: 5
            maxLength: 150
          minItems: 0
          maxItems: 8
        steps:
          type: array
          items:
            "$ref": "#/components/schemas/StepItem"
          minItems: 0
          maxItems: 6
        gallery:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              mediaId:
                type: string
                minLength: 1
                maxLength: 150
              caption:
                type: string
                minLength: 5
                maxLength: 100
            required:
            - mediaId
            - caption
          minItems: 0
          maxItems: 6
        comparisons:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              title:
                type: string
                minLength: 2
                maxLength: 30
              beforeMediaId:
                type: string
                minLength: 1
                maxLength: 150
              afterMediaId:
                type: string
                minLength: 1
                maxLength: 150
              description:
                type: string
                minLength: 5
                maxLength: 200
              effectNotice:
                type: string
                minLength: 5
                maxLength: 150
            required:
            - title
            - beforeMediaId
            - afterMediaId
            - description
            - effectNotice
          minItems: 0
          maxItems: 3
        faqs:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              question:
                type: string
                minLength: 5
                maxLength: 60
              answer:
                type: string
                minLength: 5
                maxLength: 300
            required:
            - question
            - answer
          minItems: 0
          maxItems: 6
    ServiceProfile:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        templateKey:
          type: string
          minLength: 1
          maxLength: 64
        serviceTarget:
          type: string
          minLength: 5
          maxLength: 150
        billing:
          type: object
          additionalProperties: false
          properties:
            unitDefinition:
              type: string
              minLength: 5
              maxLength: 120
            quantity:
              "$ref": "#/components/schemas/QuantityRule"
            quantityExplanation:
              type: string
              minLength: 5
              maxLength: 200
            visitFeeMode:
              type: string
              enum:
              - INCLUDED
              - WAIVED
              - NOT_APPLICABLE
            feeDescription:
              type: string
              minLength: 5
              maxLength: 200
          required:
          - unitDefinition
          - quantity
          - quantityExplanation
          - visitFeeMode
          - feeDescription
        includedItems:
          type: array
          items:
            "$ref": "#/components/schemas/ServiceItem"
          minItems: 1
          maxItems: 12
        excludedItems:
          type: array
          items:
            "$ref": "#/components/schemas/ExcludedItem"
          minItems: 0
          maxItems: 12
        unsuitableConditions:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 100
          minItems: 0
          maxItems: 8
        purchaseNotices:
          type: array
          items:
            type: string
            minLength: 5
            maxLength: 150
          minItems: 0
          maxItems: 8
        acceptanceCriteria:
          type: array
          items:
            type: string
            minLength: 5
            maxLength: 150
          minItems: 1
          maxItems: 8
        afterSales:
          "$ref": "#/components/schemas/AfterSales"
        demandCollection:
          type: object
          additionalProperties: false
          properties:
            description:
              "$ref": "#/components/schemas/CollectionField"
            media:
              "$ref": "#/components/schemas/CollectionField"
          required:
          - description
          - media
        enhancements:
          anyOf:
          - "$ref": "#/components/schemas/Enhancements"
          - type: 'null'
      required:
      - schemaVersion
      - serviceTarget
      - billing
      - includedItems
      - acceptanceCriteria
      - afterSales
      - demandCollection
      description: Drafts may be incomplete. Publishing requires all core business
        fields; WARRANTY requires period; enabled media and enhancement entries must
        be complete. Maximum 64 KiB. No layout/modules/style fields.
    SkuWrite:
      type: object
      additionalProperties: false
      properties:
        categoryId:
          type: string
          minLength: 1
          maxLength: 150
        name:
          type: string
          minLength: 2
          maxLength: 128
        description:
          type: string
          maxLength: 500
        detailProfile:
          "$ref": "#/components/schemas/DraftServiceProfile"
        priceMode:
          type: string
          enum:
          - FIXED
        basePrice:
          type: integer
          minimum: 0
          maximum: 99999999
        unit:
          type: string
          minLength: 1
          maxLength: 8
        coverMediaId:
          type: string
        galleryMediaIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 150
          minItems: 0
          maxItems: 8
        requiredSkillIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 150
          minItems: 0
          maxItems: 100
        version:
          type: integer
          minimum: 0
      required:
      - categoryId
      - name
      - detailProfile
      - priceMode
      - unit
    SkuTemplate:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 2
          maxLength: 30
        unit:
          type: string
          minLength: 1
          maxLength: 8
        profile:
          "$ref": "#/components/schemas/DraftServiceProfile"
        candidates:
          type: array
          items:
            "$ref": "#/components/schemas/ServiceItem"
          minItems: 0
          maxItems: 12
      required:
      - key
      - name
      - unit
      - profile
      - candidates
    ServiceSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 150
        skuCode:
          type: string
          minLength: 1
          maxLength: 150
        name:
          type: string
          minLength: 2
          maxLength: 128
        description:
          type: string
        priceMode:
          type: string
          enum:
          - FIXED
        price:
          type: integer
        unit:
          type: string
          minLength: 1
          maxLength: 8
        coverImageUrl:
          type: string
          minLength: 1
          maxLength: 150
        galleryImageUrls:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 150
          minItems: 0
          maxItems: 9
        publishedVersion:
          type: integer
        unitDefinition:
          type: string
          minLength: 5
          maxLength: 120
        quantityRule:
          "$ref": "#/components/schemas/QuantityRule"
    ServiceDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 150
        skuCode:
          type: string
          minLength: 1
          maxLength: 150
        name:
          type: string
          minLength: 2
          maxLength: 128
        description:
          type: string
        priceMode:
          type: string
          enum:
          - FIXED
        price:
          type: integer
        unit:
          type: string
          minLength: 1
          maxLength: 8
        coverImageUrl:
          type: string
          minLength: 1
          maxLength: 150
        galleryImageUrls:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 150
          minItems: 0
          maxItems: 8
        publishedVersion:
          type: integer
        detailProfile:
          "$ref": "#/components/schemas/ServiceProfile"
      required:
      - id
      - name
      - price
      - unit
      - publishedVersion
      - detailProfile
    CartDemandWrite:
      type: object
      additionalProperties: false
      properties:
        demandDescription:
          type: string
          maxLength: 500
        mediaIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 150
          minItems: 0
          maxItems: 8
      required:
      - demandDescription
      - mediaIds
    DemandMedia:
      type: object
      properties:
        id:
          type: string
        mediaType:
          enum:
          - IMAGE
          - VIDEO
        name:
          type: string
        url:
          type: string
    CartItem:
      type: object
      properties:
        id:
          type: string
        skuId:
          type: string
        name:
          type: string
        unit:
          type: string
        coverImageUrl:
          type: string
        demandDescription:
          type: string
        skuVersion:
          type: integer
        currentVersion:
          type: integer
        quantity:
          type: integer
        unitPrice:
          type: integer
        subtotal:
          type: integer
        available:
          type: boolean
        needsConfirmation:
          type: boolean
        demandComplete:
          type: boolean
        detailProfile:
          "$ref": "#/components/schemas/ServiceProfile"
        demandMedia:
          type: array
          items:
            "$ref": "#/components/schemas/DemandMedia"
    CartView:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CartItem"
        itemCount:
          type: integer
        totalAmount:
          type: integer
    ExcludedItem:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 30
        description:
          type: string
          minLength: 5
          maxLength: 200
      required:
      - title
      - description
    StepItem:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 30
        description:
          type: string
          minLength: 5
          maxLength: 200
        iconKey:
          type: string
          enum:
          - service
          - inspect
          - protect
          - tool
          - clean
          - install
          - report
          - confirm
      required:
      - title
      - description
    DraftServiceProfile:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        templateKey:
          type: string
          minLength: 0
          maxLength: 64
        serviceTarget:
          type: string
          minLength: 0
          maxLength: 150
        billing:
          type: object
          additionalProperties: false
          properties:
            unitDefinition:
              type: string
              minLength: 0
              maxLength: 120
            quantity:
              type: object
              additionalProperties: false
              properties:
                min:
                  type: integer
                  minimum: 0
                  maximum: 9999
                max:
                  type: integer
                  minimum: 0
                  maximum: 9999
                step:
                  type: integer
                  minimum: 0
                  maximum: 9999
                aggregation:
                  type: string
                  enum:
                  - INDEPENDENT
                  - ADDITIVE
                  - ''
            quantityExplanation:
              type: string
              minLength: 0
              maxLength: 200
            visitFeeMode:
              type: string
              enum:
              - INCLUDED
              - WAIVED
              - NOT_APPLICABLE
              - ''
            feeDescription:
              type: string
              minLength: 0
              maxLength: 200
        includedItems:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: false
            properties:
              title:
                type: string
                minLength: 0
                maxLength: 30
              description:
                type: string
                minLength: 0
                maxLength: 200
              iconKey:
                type: string
                enum:
                - service
                - inspect
                - protect
                - tool
                - clean
                - install
                - report
                - confirm
                - ''
              imageMediaId:
                type: string
                minLength: 0
                maxLength: 150
          minItems: 0
          maxItems: 12
        excludedItems:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: false
            properties:
              title:
                type: string
                minLength: 0
                maxLength: 30
              description:
                type: string
                minLength: 0
                maxLength: 200
          minItems: 0
          maxItems: 12
        unsuitableConditions:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 0
            maxLength: 100
          minItems: 0
          maxItems: 8
        purchaseNotices:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 0
            maxLength: 150
          minItems: 0
          maxItems: 8
        acceptanceCriteria:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 0
            maxLength: 150
          minItems: 0
          maxItems: 8
        afterSales:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
              - WARRANTY
              - REWORK
              - SUPPORT
              - ''
            summary:
              type: string
              minLength: 0
              maxLength: 120
            coverage:
              type: string
              minLength: 0
              maxLength: 300
            exclusions:
              type:
              - array
              - 'null'
              items:
                type: string
                minLength: 0
                maxLength: 150
              minItems: 0
              maxItems: 8
            contactDescription:
              type: string
              minLength: 0
              maxLength: 150
            period:
              type: object
              additionalProperties: false
              properties:
                value:
                  type: integer
                  minimum: 0
                  maximum: 3650
                unit:
                  type: string
                  enum:
                  - HOUR
                  - DAY
                  - MONTH
                  - ''
                startDescription:
                  type: string
                  minLength: 0
                  maxLength: 100
        demandCollection:
          type: object
          additionalProperties: false
          properties:
            description:
              type: object
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum:
                  - HIDDEN
                  - OPTIONAL
                  - REQUIRED
                  - ''
                label:
                  type: string
                  minLength: 0
                  maxLength: 20
                hint:
                  type: string
                  minLength: 0
                  maxLength: 150
            media:
              type: object
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum:
                  - HIDDEN
                  - OPTIONAL
                  - REQUIRED
                  - ''
                label:
                  type: string
                  minLength: 0
                  maxLength: 20
                hint:
                  type: string
                  minLength: 0
                  maxLength: 150
        enhancements:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              tags:
                type:
                - array
                - 'null'
                items:
                  type: string
                  minLength: 0
                  maxLength: 16
                minItems: 0
                maxItems: 6
              facts:
                type:
                - array
                - 'null'
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    label:
                      type: string
                      minLength: 0
                      maxLength: 20
                    value:
                      type: string
                      minLength: 0
                      maxLength: 100
                minItems: 0
                maxItems: 8
              resources:
                type:
                - array
                - 'null'
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 0
                      maxLength: 30
                    provider:
                      type: string
                      enum:
                      - PROVIDER
                      - CUSTOMER
                      - SHARED
                      - ''
                    description:
                      type: string
                      minLength: 0
                      maxLength: 150
                minItems: 0
                maxItems: 8
              preparations:
                type:
                - array
                - 'null'
                items:
                  type: string
                  minLength: 0
                  maxLength: 150
                minItems: 0
                maxItems: 8
              steps:
                type:
                - array
                - 'null'
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    title:
                      type: string
                      minLength: 0
                      maxLength: 30
                    description:
                      type: string
                      minLength: 0
                      maxLength: 200
                    iconKey:
                      type: string
                      enum:
                      - service
                      - inspect
                      - protect
                      - tool
                      - clean
                      - install
                      - report
                      - confirm
                      - ''
                minItems: 0
                maxItems: 6
              gallery:
                type:
                - array
                - 'null'
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    mediaId:
                      type: string
                      minLength: 0
                      maxLength: 150
                    caption:
                      type: string
                      minLength: 0
                      maxLength: 100
                minItems: 0
                maxItems: 6
              comparisons:
                type:
                - array
                - 'null'
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    title:
                      type: string
                      minLength: 0
                      maxLength: 30
                    beforeMediaId:
                      type: string
                      minLength: 0
                      maxLength: 150
                    afterMediaId:
                      type: string
                      minLength: 0
                      maxLength: 150
                    description:
                      type: string
                      minLength: 0
                      maxLength: 200
                    effectNotice:
                      type: string
                      minLength: 0
                      maxLength: 150
                minItems: 0
                maxItems: 3
              faqs:
                type:
                - array
                - 'null'
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    question:
                      type: string
                      minLength: 0
                      maxLength: 60
                    answer:
                      type: string
                      minLength: 0
                      maxLength: 300
                minItems: 0
                maxItems: 6
          - type: 'null'
      description: Draft fields may be incomplete. Publishing uses the strict ServiceProfile
        and conditional policy/media validation.
      required:
      - schemaVersion
    WorkerServiceItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        unit:
          type: string
        quantity:
          type: integer
          description: Purchased units; cumulative billing is not an evidence-object
            count.
        detailProfile:
          "$ref": "#/components/schemas/ServiceProfile"
        customerNote:
          type: string
        customerMedia:
          type: array
          items:
            "$ref": "#/components/schemas/DemandMedia"
        evidencePairs:
          type: array
          items:
            type: object
            properties:
              unitNo:
                type: integer
              before:
                type: object
              after:
                type: object
paths:
  "/api/v1/admin/auth/login":
    post:
      responses:
        '200':
          description: Admin session created
        '401':
          description: Invalid credentials
  "/api/v1/admin/auth/logout":
    post:
      security:
      - adminSession: []
      responses:
        '200':
          description: Session revoked
  "/api/v1/admin/auth/me":
    get:
      security:
      - adminSession: []
      responses:
        '200':
          description: Current admin and effective permissions
  "/api/v1/admin/auth/password":
    post:
      security:
      - adminSession: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Password changed
  "/api/v1/admin/permissions":
    get:
      security:
      - adminSession: []
      responses:
        '200':
          description: Permission catalog
  "/api/v1/admin/roles":
    get:
      security:
      - adminSession: []
      responses:
        '200':
          description: Role list
    post:
      security:
      - adminSession: []
      responses:
        '200':
          description: Role created
  "/api/v1/admin/users":
    get:
      security:
      - adminSession: []
      responses:
        '200':
          description: Admin user list
    post:
      security:
      - adminSession: []
      responses:
        '200':
          description: Admin user created with one-time temporary password
  "/api/v1/admin/users/{id}/status":
    post:
      security:
      - adminSession: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
