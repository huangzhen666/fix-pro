                  type: object
                  required:
                  - skuId
                  - skuVersion
                  - quantity
                  properties:
                    skuId:
                      type: string
                    skuVersion:
                      type: integer
                      minimum: 1
                    quantity:
                      type: integer
                      minimum: 1
                      maximum: 9999
                    demandDescription:
                      type: string
                      maxLength: 500
                    mediaIds:
                      type: array
                      items:
                        type: string
                        minLength: 1
                        maxLength: 150
                      minItems: 0
                      maxItems: 8
      responses:
        '200':
          description: Order created or replayed
