        are required only by the published demandCollection rules. Content or demand
        rule changes require confirmation. Errors: SKU_QUANTITY_INVALID, ORDER_DEMAND_REQUIRED,
        CART_SKU_CHANGED. Orders retain detailProfile snapshots.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
