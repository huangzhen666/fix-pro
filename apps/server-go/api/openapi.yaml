        schema:
          type: string
          maxLength: 128
      description: '使用 cartItemIds 结算购物车选中项，或使用 directItem 立即下单。两者不能同时传递；立即下单不会修改购物车，价格由服务端已发布版本确定。下架服务禁止下单，返回
